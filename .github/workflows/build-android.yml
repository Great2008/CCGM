name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Set build version
        run: |
          VERSION="$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "{ \"version\": \"$VERSION\", \"buildDate\": \"$(date +'%Y-%m-%d')\" }" > public/version.json
          echo "Version set to $VERSION"

      - name: Build Vite app
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npm install @capacitor/splash-screen @capacitor/status-bar
          npm install @capacitor/push-notifications @capacitor/haptics
          npm install @capacitor/share @capacitor/network
          npm install @capawesome/capacitor-badge

      - name: Add Android platform
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.cjs
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ── Write google-services.json for FCM push notifications ────────
      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          echo "✅ google-services.json written:"
          cat android/app/google-services.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('Package:', d['client'][0]['client_info']['android_client_info']['package_name'])"

      # ── Ensure google-services plugin is in build.gradle ─────────────
      - name: Apply Google Services Gradle plugin
        run: |
          # Add google-services to project-level build.gradle if not present
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s/classpath 'com.android.tools.build:gradle/classpath 'com.google.gms:google-services:4.4.0'\n        classpath 'com.android.tools.build:gradle/" android/build.gradle
          fi
          # Add apply plugin to app-level build.gradle if not present
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          echo "✅ Gradle plugin check done"

      - name: Sync Capacitor with Android
        run: npx cap sync android

      # Icons copied AFTER sync so they are not overwritten
      - name: Copy app icons
        run: |
          MIPMAP=android/app/src/main/res
          cp public/icon-72.png  $MIPMAP/mipmap-mdpi/ic_launcher.png
          cp public/icon-72.png  $MIPMAP/mipmap-mdpi/ic_launcher_round.png
          cp public/icon-72.png  $MIPMAP/mipmap-mdpi/ic_launcher_foreground.png
          cp public/icon-96.png  $MIPMAP/mipmap-hdpi/ic_launcher.png
          cp public/icon-96.png  $MIPMAP/mipmap-hdpi/ic_launcher_round.png
          cp public/icon-96.png  $MIPMAP/mipmap-hdpi/ic_launcher_foreground.png
          cp public/icon-96.png  $MIPMAP/mipmap-xhdpi/ic_launcher.png
          cp public/icon-96.png  $MIPMAP/mipmap-xhdpi/ic_launcher_round.png
          cp public/icon-96.png  $MIPMAP/mipmap-xhdpi/ic_launcher_foreground.png
          cp public/icon-144.png $MIPMAP/mipmap-xxhdpi/ic_launcher.png
          cp public/icon-144.png $MIPMAP/mipmap-xxhdpi/ic_launcher_round.png
          cp public/icon-144.png $MIPMAP/mipmap-xxhdpi/ic_launcher_foreground.png
          cp public/icon-192.png $MIPMAP/mipmap-xxxhdpi/ic_launcher.png
          cp public/icon-192.png $MIPMAP/mipmap-xxxhdpi/ic_launcher_round.png
          cp public/icon-192.png $MIPMAP/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Gradle permissions
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # ── Sign the release APK ──────────────────────────────────────────
      - name: Sign release APK
        run: |
          # Decode keystore from secret
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ccgworld.keystore
          # Build signed release APK
          cd android && ./gradlew assembleRelease --no-daemon
          # Sign it
          jarsigner -verbose \
            -keystore ../ccgworld.keystore \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -signedjar ../CCGWorld-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "${{ secrets.KEY_ALIAS }}"
          cd ..
          # Align
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/zipalign \
            -v 4 CCGWorld-signed.apk CCGWorld-latest.apk || \
            cp CCGWorld-signed.apk CCGWorld-latest.apk

      # ── Rename APK with consistent name for permanent URL ────────────
      - name: Prepare release files
        run: |
          # CCGWorld-latest.apk already created by sign step above
          # Fall back to debug if signing secrets not configured
          if [ ! -f CCGWorld-latest.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk CCGWorld-latest.apk
          fi

      # ── Upload APK as artifact (always) ──────────────────────────────
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCGWorld-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCGWorld-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Create/update GitHub Release with public APK download ─────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CCG World — Latest Build
          body: |
            ## CCG World Android App — ${{ env.VERSION }}
            
            📱 **Download the APK below and install on your Android phone.**
            
            > Enable "Install from unknown sources" in your phone settings before installing.
            
            Built from commit: ${{ github.sha }}
            Date: ${{ github.event.head_commit.timestamp }}
          files: CCGWorld-latest.apk
          make_latest: true
          prerelease: false
