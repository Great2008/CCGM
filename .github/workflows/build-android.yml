name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Node ─────────────────────────────────────────────────
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 3. Install dependencies ───────────────────────────────────────
      - name: Install npm dependencies
        run: npm install

      # ── 4. Create .env from GitHub Secrets ───────────────────────────
      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      # ── 5. Build React/Vite app ───────────────────────────────────────
      - name: Build Vite app
        run: npm run build

      # ── 6. Install Capacitor CLI + plugins ───────────────────────────
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npm install @capacitor/splash-screen @capacitor/status-bar @capacitor/push-notifications

      # ── 7. Add Android platform ───────────────────────────────────────
      - name: Add Android platform
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.cjs
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ── 8. Copy app icons into Android mipmap folders ─────────────────
      - name: Copy app icons
        run: |
          MIPMAP=android/app/src/main/res
          cp public/icon-72.png  $MIPMAP/mipmap-mdpi/ic_launcher.png
          cp public/icon-72.png  $MIPMAP/mipmap-mdpi/ic_launcher_round.png
          cp public/icon-96.png  $MIPMAP/mipmap-hdpi/ic_launcher.png
          cp public/icon-96.png  $MIPMAP/mipmap-hdpi/ic_launcher_round.png
          cp public/icon-96.png  $MIPMAP/mipmap-xhdpi/ic_launcher.png
          cp public/icon-96.png  $MIPMAP/mipmap-xhdpi/ic_launcher_round.png
          cp public/icon-144.png $MIPMAP/mipmap-xxhdpi/ic_launcher.png
          cp public/icon-144.png $MIPMAP/mipmap-xxhdpi/ic_launcher_round.png
          cp public/icon-192.png $MIPMAP/mipmap-xxxhdpi/ic_launcher.png
          cp public/icon-192.png $MIPMAP/mipmap-xxxhdpi/ic_launcher_round.png

      # ── 9. Sync Capacitor ─────────────────────────────────────────────
      - name: Sync Capacitor with Android
        run: npx cap sync android

      # ── 10. Setup Java 17 ─────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 11. Grant Gradle execute permission ───────────────────────────
      - name: Grant Gradle permissions
        working-directory: android
        run: chmod +x gradlew

      # ── 12. Build debug APK (unsigned — for testing) ──────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── 13. Build release AAB (unsigned — for Play Store) ─────────────
      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # ── 14. Upload APK artifact ───────────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: CCGWorld-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # ── 15. Upload AAB artifact ───────────────────────────────────────
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: CCGWorld-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
