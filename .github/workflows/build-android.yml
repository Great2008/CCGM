name: Build Android APK & AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Set build version
        run: |
          VERSION="$(date +'%Y.%m.%d')-$(echo $GITHUB_SHA | cut -c1-7)"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "{ \"version\": \"$VERSION\", \"buildDate\": \"$(date +'%Y-%m-%d')\" }" > public/version.json
          echo "Version set to $VERSION"

      - name: Build Vite app
        run: npm run build

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli
          npm install @capacitor/android
          npm install @capacitor/filesystem
          npm install @capacitor/splash-screen @capacitor/status-bar
          npm install @capacitor/push-notifications @capacitor/haptics
          npm install @capacitor/share @capacitor/network
          npm install @capawesome/capacitor-badge

      - name: Add Android platform
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.js
          rm -f capacitor.config.cjs
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # ── Write google-services.json for FCM push notifications ────────
      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json
          echo "✅ google-services.json written:"
          cat android/app/google-services.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('Package:', d['client'][0]['client_info']['android_client_info']['package_name'])"

      # ── Ensure google-services plugin is in build.gradle ─────────────
      - name: Apply Google Services Gradle plugin
        run: |
          # Add google-services to project-level build.gradle if not present
          if ! grep -q "google-services" android/build.gradle; then
            sed -i "s/classpath 'com.android.tools.build:gradle/classpath 'com.google.gms:google-services:4.4.0'\n        classpath 'com.android.tools.build:gradle/" android/build.gradle
          fi
          # Add apply plugin to app-level build.gradle if not present
          if ! grep -q "com.google.gms.google-services" android/app/build.gradle; then
            echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle
          fi
          echo "✅ Gradle plugin check done"

      - name: Sync Capacitor with Android
        run: npx cap sync android

      # Icons copied AFTER sync so they are not overwritten
      - name: Install Pillow for icon processing
        run: pip install Pillow --quiet

      - name: Generate and copy app icons
        run: |
          python3 - << 'PYEOF'
          from PIL import Image
          import os

          MIPMAP = "android/app/src/main/res"
          VALUES = "android/app/src/main/res/values"

          # density -> (foreground_canvas_px, launcher_size_px, source_icon)
          # Foreground canvas = 1.5x launcher size (108dp equivalent per density)
          # Logo rendered at 66% of canvas = natural padding / safe zone
          densities = {
              "mipmap-mdpi":    (108, 48,  "public/icon-72.png"),
              "mipmap-hdpi":    (162, 72,  "public/icon-96.png"),
              "mipmap-xhdpi":   (216, 96,  "public/icon-96.png"),
              "mipmap-xxhdpi":  (324, 144, "public/icon-144.png"),
              "mipmap-xxxhdpi": (432, 192, "public/icon-192.png"),
          }

          def make_foreground(src_path, canvas_px):
              logo = Image.open(src_path).convert("RGBA")
              logo_size = int(canvas_px * 0.66)
              logo = logo.resize((logo_size, logo_size), Image.LANCZOS)
              canvas = Image.new("RGBA", (canvas_px, canvas_px), (0, 0, 0, 0))
              offset = (canvas_px - logo_size) // 2
              canvas.paste(logo, (offset, offset), logo)
              return canvas

          for density, (canvas_px, launcher_px, src) in densities.items():
              out_dir = os.path.join(MIPMAP, density)
              os.makedirs(out_dir, exist_ok=True)

              # Padded foreground (transparent canvas, logo at 66%)
              fg = make_foreground(src, canvas_px)
              fg.save(os.path.join(out_dir, "ic_launcher_foreground.png"))

              # Standard launcher icons (exact size, no padding)
              icon = Image.open(src).convert("RGBA").resize((launcher_px, launcher_px), Image.LANCZOS)
              icon.save(os.path.join(out_dir, "ic_launcher.png"))
              icon.save(os.path.join(out_dir, "ic_launcher_round.png"))
              print(f"✅ {density}: launcher={launcher_px}px, foreground={canvas_px}px canvas")

          # Background color resource
          os.makedirs(VALUES, exist_ok=True)
          with open(os.path.join(VALUES, "ic_launcher_background.xml"), "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#FFFFFF</color>\n</resources>\n')
          print("✅ ic_launcher_background.xml (white)")

          # Adaptive icon XMLs for Android 8+
          anydpi = os.path.join(MIPMAP, "mipmap-anydpi-v26")
          os.makedirs(anydpi, exist_ok=True)
          xml = '<?xml version="1.0" encoding="utf-8"?>\n<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n    <background android:drawable="@color/ic_launcher_background"/>\n    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n</adaptive-icon>\n'
          for fname in ("ic_launcher.xml", "ic_launcher_round.xml"):
              with open(os.path.join(anydpi, fname), "w") as f:
                  f.write(xml)
          print("✅ mipmap-anydpi-v26 adaptive XMLs written")
          PYEOF

      - name: Generate Android splash drawable from logo
        run: |
          python3 - << 'PYEOF'
          from PIL import Image, ImageDraw, ImageFont
          import math, os

          densities = {
              "drawable-mdpi":    (480,  800),
              "drawable-hdpi":    (720,  1280),
              "drawable-xhdpi":   (960,  1600),
              "drawable-xxhdpi":  (1440, 2560),
              "drawable-xxxhdpi": (1440, 2560),
          }

          LOGO_SRC    = "public/logo.png"
          GREEN_CORE  = (0,  178,  80)
          GREEN_MID   = (72, 200, 120)
          WHITE_TINT  = (220, 245, 230)
          DARK_GREEN  = (5,  70,  25)
          MID_GREEN   = (15, 110, 45)

          logo_src = Image.open(LOGO_SRC).convert("RGBA")

          # Try to load fonts, fallback gracefully
          try:
              font_title = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf", 0)
              font_sub   = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf", 0)
              has_fonts  = True
          except:
              has_fonts  = False

          for density, (W, H) in densities.items():
              out_dir = f"android/app/src/main/res/{density}"
              os.makedirs(out_dir, exist_ok=True)

              # ── Radial gradient background ──────────────────────────
              canvas = Image.new("RGB", (W, H))
              pixels = canvas.load()
              cx, cy = W // 2, int(H * 0.22)
              max_dist = math.sqrt(W**2 + H**2) * 0.72

              for y in range(H):
                  for x in range(W):
                      dist = math.sqrt((x - cx)**2 + (y - cy)**2)
                      t    = min(dist / max_dist, 1.0)
                      t2   = t * t * (3 - 2 * t)
                      if t2 < 0.5:
                          s = t2 / 0.5
                          r = int(GREEN_CORE[0] + (GREEN_MID[0]-GREEN_CORE[0]) * s)
                          g = int(GREEN_CORE[1] + (GREEN_MID[1]-GREEN_CORE[1]) * s)
                          b = int(GREEN_CORE[2] + (GREEN_MID[2]-GREEN_CORE[2]) * s)
                      else:
                          s = (t2 - 0.5) / 0.5
                          r = int(GREEN_MID[0] + (WHITE_TINT[0]-GREEN_MID[0]) * s)
                          g = int(GREEN_MID[1] + (WHITE_TINT[1]-GREEN_MID[1]) * s)
                          b = int(GREEN_MID[2] + (WHITE_TINT[2]-GREEN_MID[2]) * s)
                      pixels[x, y] = (r, g, b)

              # ── Logo ────────────────────────────────────────────────
              logo_w = int(W * 0.50)
              logo_h = int(logo_src.height * (logo_w / logo_src.width))
              resized = logo_src.resize((logo_w, logo_h), Image.LANCZOS)
              lx = (W - logo_w) // 2
              ly = int(H * 0.17)
              canvas.paste(resized, (lx, ly), resized)

              # ── Text ────────────────────────────────────────────────
              draw = ImageDraw.Draw(canvas)
              text_y = ly + logo_h + int(H * 0.04)

              if has_fonts:
                  ft = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif-Bold.ttf", int(W * 0.128))
                  fs = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSerif.ttf",      int(W * 0.050))
              else:
                  ft = fs = ImageFont.load_default()

              t1 = "CCG World"
              bb1 = draw.textbbox((0, 0), t1, font=ft)
              draw.text(((W - (bb1[2]-bb1[0])) // 2, text_y), t1, font=ft, fill=DARK_GREEN)
              text_y += (bb1[3] - bb1[1]) + int(H * 0.014)

              t2 = "Christian Church Of God Mission"
              bb2 = draw.textbbox((0, 0), t2, font=fs)
              draw.text(((W - (bb2[2]-bb2[0])) // 2, text_y), t2, font=fs, fill=MID_GREEN)

              canvas.save(f"{out_dir}/splash.png")
              print(f"✅ {density}/splash.png ({W}x{H})")
          PYEOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant Gradle permissions
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ── Upload working debug APK to Supabase immediately ─────────────
      - name: Upload APK to Supabase Storage
        run: |
          # Verify file is a real APK
          file android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

          curl -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/storage/v1/object/apk/CCGWorld-latest.apk" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "Content-Disposition: attachment; filename=CCGWorld-latest.apk" \
            -H "x-upsert: true" \
            --data-binary @android/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ APK uploaded to Supabase"
      - name: Setup keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            # Restore existing keystore from secret
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ccgworld.keystore
            echo "✅ Keystore restored from secret"
          else
            # First run — generate a new keystore automatically
            keytool -genkey -v \
              -keystore ccgworld.keystore \
              -alias ccgworld \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CCG World, OU=App, O=CCGM, L=Unknown, S=Unknown, C=NG" \
              -storepass ccgworld2024 \
              -keypass ccgworld2024
            echo "✅ New keystore generated"
            # Print base64 so you can copy it into secrets
            echo "⚠️  SAVE THIS AS KEYSTORE_BASE64 SECRET:"
            base64 ccgworld.keystore
          fi

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # ── Sign the release APK ──────────────────────────────────────────
      - name: Sign release APK
        run: |
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
          KEY_ALIAS="${{ secrets.KEY_ALIAS }}"
          # Use defaults if secrets not set yet
          [ -z "$STORE_PASS" ] && STORE_PASS="ccgworld2024"
          [ -z "$KEY_PASS" ]   && KEY_PASS="ccgworld2024"
          [ -z "$KEY_ALIAS" ]  && KEY_ALIAS="ccgworld"
          # Build signed release APK
          cd android && ./gradlew assembleRelease --no-daemon
          # Sign
          jarsigner -verbose \
            -keystore ../ccgworld.keystore \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -signedjar ../CCGWorld-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$KEY_ALIAS"
          cd ..
          # Align
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/zipalign \
            -v 4 CCGWorld-signed.apk CCGWorld-latest.apk || \
            cp CCGWorld-signed.apk CCGWorld-latest.apk
          echo "✅ Signed APK ready"

      # ── Rename APK with consistent name for permanent URL ────────────
      - name: Prepare release files
        run: |
          # CCGWorld-latest.apk already created by sign step above
          # Fall back to debug if signing secrets not configured
          if [ ! -f CCGWorld-latest.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk CCGWorld-latest.apk
          fi

      # ── Upload APK as artifact (backup) ──────────────────────────────
      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCGWorld-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCGWorld-release.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Create/update GitHub Release with public APK download ─────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CCG World — Latest Build
          body: |
            ## CCG World Android App — ${{ env.VERSION }}
            
            📱 **Download the APK below and install on your Android phone.**
            
            > Enable "Install from unknown sources" in your phone settings before installing.
            
            Built from commit: ${{ github.sha }}
            Date: ${{ github.event.head_commit.timestamp }}
          files: CCGWorld-latest.apk
          make_latest: true
          prerelease: false
